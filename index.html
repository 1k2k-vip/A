<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasikorn Bank Card Design</title>
    <style>
        /* CSS Styles */
        .kasikorn-card {
            width: 500px; /* Card Width */
            height: 300px; /* Card Height */
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        /* Header Section Styles */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-section {
            display: flex;
            align-items: center;
        }

        .large-k {
            font-size: 100px;
            color: #00A651;
            font-weight: bold;
            line-height: 0.8;
            margin-right: 15px;
            font-family: 'Times New Roman', Times, serif;
        }

        .bank-name h3 {
            margin: 0;
            font-size: 24px;
            color: #333;
            font-weight: normal;
        }

        .bank-name p {
            margin: 0;
            font-size: 14px;
            color: #777;
        }

        .bank-name .kasikorn-english {
            font-weight: bold;
            color: #333;
        }

        .small-logo {
            width: 60px;
            height: 60px;
            border: 2px solid #00A651;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            padding: 5px;
        }

        /* Simplified Logo Representation */
        .small-logo-leaf {
            width: 40px;
            height: 40px;
            background-color: #00A651;
            border-radius: 50% 50% 0 0;
            position: relative;
        }

        /* Body Section - Data Swapped */
        .account-info {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .bank-code-label {
            background-color: #00A651;
            color: white;
            padding: 8px 15px;
            font-size: 20px;
            font-weight: bold;
            margin-right: 20px;
        }

        .account-number {
            /* ဤနေရာသည် မူလက ဘဏ်နံပါတ်နေရာဖြစ်သော်လည်း ယခုအခါ 'နာမည်' ကို ထည့်ရန် */
            font-size: 30px; 
            font-weight: bold;
            color: #555;
            letter-spacing: 2px;
        }

        /* Name Section - Data Swapped */
        .name-block {
            background-color: #00A651;
            color: white;
            padding: 15px 20px;
            /* ဤနေရာသည် မူလက နာမည်နေရာဖြစ်သော်လည်း ယခုအခါ 'ဘဏ်နံပါတ်' ကို ထည့်ရန် */
            font-size: 30px; 
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="kasikorn-card">
    <div class="card-header">
        <div class="logo-section">
            <span class="large-k">K</span>
            <div class="bank-name">
                <h3>ธนาคารกสิกรไทย</h3>
                <p>开泰银行 <span class="kasikorn-english">KASIKORNBANK</span></p>
            </div>
        </div>
        <div class="small-logo">
            <div class="small-logo-leaf"></div>
        </div>
    </div>

    <div class="account-info">
        <div class="bank-code-label">KASIKORNTHAI</div>
        <div class="account-number">သင်၏ နာမည်ကို ဤနေရာတွင် ထည့်ပါ</div> 
    </div>

    <div class="name-block">
        သင်၏ ဘဏ်နံပါတ်ကို ဤနေရာတွင် ထည့်ပါ (ဥပမာ: 1234567890)
    </div>
</div>

</body>
</html>
