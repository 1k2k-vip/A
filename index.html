<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivo Y72 5G Wallpaper Mockup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <h2>📱 Vivo Y72 5G Wallpaper Mockup ဖန်တီးပါ</h2>

        <div class="upload-area">
            ပုံကို ဤနေရာသို့ ဆွဲထည့်ပါ သို့မဟုတ် <input type="file" id="imageUpload" accept="image/png, image/jpeg"> ရွေးချယ်ပါ
        </div>
        
        <div class="mockup-section">
            <h3>Vivo Y72 5G ဖုန်းမျက်နှာပြင်</h3>
            
            <div id="phoneFrame" class="phone-frame vivo-y72">
                <div id="wallpaperScreen" class="inner-screen">
                    </div>
                <div class="camera-cutout"></div>
            </div>
            
            <button id="generateMockupBtn" class="download-button">
                 Mockup ပုံထုတ်ယူရန်
            </button>
            
            <a href="#" id="downloadLink" download="vivo-y72-wallpaper-mockup.png" class="download-link" style="display:none;">
                <button class="download-button save-btn">
                    ⬇️ Mockup ပုံကို ဒေါင်းလုဒ်လုပ်ရန်
                </button>
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
