<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasikorn Bank Card Design</title>
    <style>
        /* Global Styles for the card */
        .kasikorn-card {
            width: 500px; /* Adjust size as needed */
            height: 300px; /* Adjust size as needed */
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        /* Header Section */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo-section {
            display: flex;
            align-items: center;
        }

        .large-k {
            font-size: 100px; /* Large K size */
            color: #00A651; /* Green color */
            font-weight: bold;
            line-height: 0.8;
            margin-right: 15px;
            font-family: 'Times New Roman', Times, serif; /* Using a serif font for a script look */
        }

        .bank-name h3 {
            margin: 0;
            font-size: 24px;
            color: #333;
            font-weight: normal;
        }

        .bank-name p {
            margin: 0;
            font-size: 14px;
            color: #777;
        }

        .bank-name .kasikorn-english {
            font-weight: bold;
            color: #333;
        }

        .small-logo {
            width: 60px; /* Small logo size */
            height: 60px;
            border: 2px solid #00A651; /* Green border */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            padding: 5px;
        }

        .small-logo-leaf {
            width: 40px;
            height: 40px;
            background-color: #00A651;
            border-radius: 50% 50% 0 0;
            position: relative;
        }
        /* Simplification for the leaf logo - hard to replicate exactly with pure CSS */
        .small-logo-leaf::before {
            content: 'Y'; /* Placeholder for the leaf shape */
            color: white;
            font-size: 30px;
            position: absolute;
            top: -5px;
            left: 5px;
            transform: rotate(180deg);
        }

        /* Body Section - Account Info */
        .account-info {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .bank-code-label {
            background-color: #00A651; /* Green block */
            color: white;
            padding: 8px 15px;
            font-size: 20px;
            font-weight: bold;
            margin-right: 20px;
        }

        .account-number {
            font-size: 30px;
            font-weight: bold;
            color: #555;
            letter-spacing: 2px;
        }

        /* Name Section */
        .name-block {
            background-color: #00A651; /* Green block */
            color: white;
            padding: 15px 20px;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="kasikorn-card">
    <div class="card-header">
        <div class="logo-section">
            <span class="large-k">K</span>
            <div class="bank-name">
                <h3>ธนาคารกสิกรไทย</h3>
                <p>开泰银行 <span class="kasikorn-english">KASIKORNBANK</span></p>
            </div>
        </div>
        <div class="small-logo">
            <div class="small-logo-leaf"></div>
        </div>
    </div>

    <div class="account-info">
        <div class="bank-code-label">KASIKORNTHAI</div>
        <div class="account-number">000-000-0000</div>
    </div>

    <div class="name-block">
        MR. TINT AUNG KHAING
    </div>
</div>

</body>
</html>
