<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallpaper Mockuper</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <h2>📱 ကိုယ်တိုင် ဖန်တီး Wallaper Mockuper</h2>

        <div class="upload-section">
            <div class="upload-area" id="dropArea">
                ပုံကို ဤနေရာသို့ ဆွဲထည့်ပါ သို့မဟုတ် <input type="file" id="imageUpload" accept="image/png, image/jpeg"> ရွေးချယ်ပါ
            </div>
            <p class="file-info" id="fileInfo">ဖိုင်ရွေးချယ်ထားခြင်းမရှိသေးပါ</p>
        </div>

        <div class="mockup-section">
            <h3>ထုတ်လုပ်ပြီးသော Mockup</h3>
            <div class="phone-frame">
                <img id="mockupImage" src="placeholder.png" alt="Phone Wallpaper Mockup" class="inner-screen">
            </div>
            <a href="#" id="downloadLink" download="my-wallpaper-mockup.png" class="download-link">
                <button class="download-button">
                    ⬇️ ပုံကို ဒေါင်းလုဒ်လုပ်ရန်
                </button>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
