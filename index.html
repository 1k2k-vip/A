<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSO VIP - All Packages</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* နောက်ခံအရောင် တရွေ့ရွေ့ပြောင်းလဲနေစေရန် */
        body {
            margin: 0;
            padding: 20px 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1e3c72);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* နှင်းကျနေသည့် ပုံစံ (Snow Animation) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://www.transparenttextures.com/patterns/snow.png');
            animation: snow 15s linear infinite;
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }

        @keyframes snow {
            0% { background-position: 0px 0px; }
            100% { background-position: 500px 1000px; }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 25px;
            border-radius: 30px;
            text-align: center;
            width: 350px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            position: relative;
            z-index: 2;
        }

        .main-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #00d2ff;
            margin-bottom: 10px;
            object-fit: cover;
            background: white;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
        }

        .logo-name-text {
            font-size: 2.2em;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: 2px;
            background: linear-gradient(to right, #00d2ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .package-title {
            color: white;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: bold;
            margin: 15px 0 8px 0;
            display: flex;
            align-items: center;
            font-size: 0.9em;
        }

        .bg-true { background: linear-gradient(90deg, #ed1c24, #ff5f6d); }
        .bg-dtac { background: linear-gradient(90deg, #00aaff, #00d2ff); }
        .bg-ais { background: linear-gradient(90deg, #94c11f, #b4ec51); }

        .package-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .package-item {
            background: rgba(255, 255, 255, 0.9);
            color: #1a1a1a;
            padding: 10px 15px;
            border-radius: 12px;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
            transition: 0.3s;
        }

        .package-item:active { transform: scale(0.95); }
        .code { font-weight: bold; }
        .price { color: #d32f2f; font-weight: bold; }

        .download-btn {
            background: linear-gradient(to right, #00c6ff, #0072ff);
            color: white;
            padding: 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 25px;
            box-shadow: 0 8px 20px rgba(0, 198, 255, 0.3);
        }

        .msg-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #0084FF;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 1000;
        }
    </style>
</head>
