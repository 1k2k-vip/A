    <style>
        /* CSS Styles */
        body {

            display: flex; 
            flex-direction: column;

            padding: 20px;

        .container { 
            background: white;

        h1 { text-align: center; color: #333; }
        
        /* ------------------ KASIKORNBANK CARD CSS (996x660) ------------------ */
        .kasikorn-card {
            width: 996px; height: 660px; 
            background-color: white; border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 40px; box-sizing: border-box; position: relative;
        }
        
        /* Header Logo (ယခင်အတိုင်း) */

        .logo-section { display: flex; align-items: center; }

        .bank-name h3 { margin: 0; font-size: 48px; color: #333; font-weight: normal; } 
        .bank-name p { margin: 0; font-size: 28px; color: #777; } 
        .small-logo { width: 120px; height: 120px; border: 4px solid #00A651; border-radius: 50%; background-color: white; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .small-logo > div { width: 80px; height: 80px; background-color: #00A651; border-radius: 50%; }

        /* Account Info Section */
        .account-info { display: flex; align-items: stretch; margin-bottom: 50px; }
        .bank-code-label { background-color: #00A651; color: white; padding: 16px 30px; font-size: 40px; font-weight: bold; margin-right: 40px; display: flex; align-items: center; }
        #accountNumberDisplay { 
            font-size: 60px; font-weight: bold; color: #555; letter-spacing: 4px;
            flex-grow: 1; display: flex; justify-content: center; align-items: center;
        }

        /* Name Section */
        #nameDisplay { 
            background-color: #00A651; color: white; padding: 30px 40px; 
            font-size: 60px; font-weight: bold; letter-spacing: 2px; min-height: 60px;
            display: flex; justify-content: center; align-items: center; 
        }
        
        /* ------------------ Controls Section ------------------ */
        .controls { display: flex; flex-direction: column; gap: 15px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
        .controls button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background-color 0.3s; }
        .controls button:hover { background-color: #0056b3; }
        #downloadBtn { background-color: #28a745; }
        
        /* *** NEW CSS for Read-Only MR. *** */
        .name-input-group {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 0 10px; /* input ကို အတွင်းမှသာ padding ပေးရန် */
            background-color: white;
        }
        .name-input-group .prefix-text {
            font-weight: bold;
            color: #555;
            margin-right: 5px;
            user-select: none; /* စာသားကို ရွေးချယ်လို့ မရအောင် */
            background-color: #f0f0f0; /* MR. အတွက် နောက်ခံအရောင် */
            padding: 8px 5px;
            border-radius: 3px;
        }
        .name-input-group input[type="text"] {
            border: none;
            padding: 10px 0; /* Input အတွင်းပိုင်း padding */
            width: 100%;
            background-color: transparent;
            font-size: 16px;
        }
        .name-input-group input[type="text"]:focus {
            outline: none;
        }
    </style>
</head>
