    <style>
        :root {
            /* နောက်ခံကို ပိုကြည်လင်တဲ့ အပြာရောင် သုံးထားပါတယ် */
            --bg-color: #bbdefb; 
            /* အဖြူရောင်နေရာကို အပြာနု မှန်ကြည် (70% transparent) ပြောင်းလိုက်ပါတယ် */
            --card-bg: rgba(187, 222, 251, 0.7); 
            --text-main: #0d47a1;
            --text-sub: #1565c0;
            
            --true-color: linear-gradient(135deg, #ff416c, #ff4b2b);
            --dtac-color: linear-gradient(135deg, #00c6ff, #0072ff);
            --ais-color: linear-gradient(135deg, #a8ff78, #78ffd6);
        }

        body {
            margin: 0; padding: 20px 10px;
            font-family: 'Zeyar', sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(to bottom, #90caf9, #e3f2fd);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
        }

        .snow-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 999;
        }

        .snowflake {
            position: absolute; top: -50px;
            background: rgba(255, 255, 255, 0.8); border-radius: 50%;
            filter: blur(1px);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0vh) translateX(0); }
            100% { transform: translateY(110vh) translateX(100px); }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 35px 22px; border-radius: 45px; text-align: center;
            width: 100%; max-width: 380px; 
            /* Border ကို အဖြူအစား အပြာရင့် သုံးထားပါတယ် */
            border: 2px solid rgba(13, 71, 161, 0.2); 
            position: relative; z-index: 10;
            box-shadow: 0 20px 40px rgba(13, 71, 161, 0.15);
        }

        /* Logo နောက်ခံကိုပါ အပြာနု ပြောင်းထားပါတယ် */
        .main-logo { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #ff416c; background: #bbdefb; padding: 4px; margin-bottom: 15px; }

        .logo-name-text { 
            font-family: 'Montserrat', sans-serif; font-size: 2.8em; font-weight: 900; 
            background: linear-gradient(45deg, #ff416c, #0d47a1, #00c6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .sub-text { color: var(--text-sub); margin-bottom: 25px; font-size: 1.1em; font-weight: bold; }

        .mini-logos { display: flex; justify-content: center; gap: 30px; margin-bottom: 30px; }
        .mini-logos a { font-size: 30px; color: #0d47a1; text-decoration: none; }

        .package-title { padding: 12px 18px; border-radius: 15px; font-weight: 800; margin: 25px 0 10px 0; font-family: 'Montserrat', sans-serif; font-size: 0.85em; text-align: left; color: #fff; }
        .bg-true { background: var(--true-color); }
        .bg-dtac { background: var(--dtac-color); }
        .bg-ais { background: var(--ais-color); color: #1a1a1b; }

        /* Package box အဖြူရောင်နေရာကို အကြည်ရောင် ပြောင်းထားပါတယ် */
        .package-item { 
            background: rgba(13, 71, 161, 0.08); 
            padding: 16px; border-radius: 22px; display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 10px; border: 1px solid rgba(13, 71, 161, 0.1); 
        }

        .code { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.35em; color: #0d47a1; }
        .price { display: block; font-size: 1em; color: #1565c0; text-align: left; }
        .call-btn { background: #2ecc71; color: white; width: 48px; height: 48px; border-radius: 16px; display: flex; justify-content: center; align-items: center; text-decoration: none; }

        .download-btn { background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; padding: 20px; border-radius: 25px; text-decoration: none; font-weight: 800; display: block; margin-top: 30px; font-family: 'Montserrat', sans-serif; box-shadow: 0 10px 20px rgba(255, 65, 108, 0.3); }
        
        .msg-btn { position: fixed; bottom: 25px; right: 25px; background: #0084FF; width: 65px; height: 65px; border-radius: 22px; display: flex; justify-content: center; align-items: center; color: white; font-size: 32px; text-decoration: none; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
