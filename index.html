<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Wallpaper Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <h2>🖼️ Wallpaper ပုံစံချရန်</h2>

        <div class="upload-section">
            <div class="upload-area" id="dropArea">
                ပုံကို ဤနေရာသို့ ဆွဲထည့်ပါ သို့မဟုတ် <input type="file" id="imageUpload" accept="image/png, image/jpeg"> ရွေးချယ်ပါ
            </div>
            <p class="file-info" id="fileInfo">ဖိုင်ရွေးချယ်ထားခြင်းမရှိသေးပါ</p>
        </div>

        <div class="image-display-section">
            <img id="displayImage" src="placeholder.png" alt="Uploaded Image" class="uploaded-image">
        </div>
        
        <div class="button-group">
             <button class="action-button set-wallpaper-btn" disabled>
                Wallpaper အဖြစ်ထားပါ (ဒေါင်းလုဒ်လုပ်ပြီးမှ ထားပါ)
            </button>
            
            <a href="#" id="downloadLink" download="my-wallpaper.png" class="download-link">
                <button class="action-button save-btn">
                    ⬇️ ပုံကို သိမ်းဆည်းပါ (Download)
                </button>
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
