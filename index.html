<!DOCTYPE html>

    <title>KSO VIP - Official UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            font-family: 'Segoe UI', sans-serif;
            /* သင်ပေးထားသော ပန်းပုံကို နောက်ခံတွင် အသုံးပြုခြင်း */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://raw.githubusercontent.com/1k2k-vip/A/main/ba.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ပုံထဲကအတိုင်း အနီရင့်ရောင် Card */
        .card {
            background: #8b4cb034; /* Dark Red Background */
            padding: 25px 15px;
            border-radius: 40px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Logo အနီရောင် Glow ဘောင် */
        .main-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #ed1c24;
            background: #ed1c24;
            display: block;
            margin: 0 auto 10px;
            box-shadow: 0 0 20px rgba(237, 28, 36, 0.6);
            object-fit: contain;
        }

        .logo-text {
            font-size: 2.2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 25px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.3);
        }

        /* ပုံထဲကအတိုင်း တစ်တန်းချင်းစီ Title ခေါင်းစဉ်များ */
        .category-title {
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            font-weight: bold;
            margin: 15px 0 10px 0;
            display: flex;
            align-items: center;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .bg-true { background: #ed1c24; }
        .bg-dtac { background: #00aaff; }
        .bg-ais { background: #76ba1b; }

        .package-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ပုံထဲကအတိုင်း အဖြူရောင် Package ခလုတ်များ */
        .package-item {
            background: #ffffff;
            color: #333;
            padding: 12px 18px;
            border-radius: 30px;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .package-item:hover { transform: scale(1.02); background: #f9f9f9; }

        .price-text {
            color: #d32f2f; /* ဈေးနှုန်းကို အနီရောင်ဖြင့် ပြထားသည် */
        }

        /* Download APK Button */
        .download-btn {
            background: #ed1c24;
            color: white;
            padding: 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(237, 28, 36, 0.4);
        }

        /* Messenger Floating Button */
        .msg-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0084FF;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }
    </style>
</head>
