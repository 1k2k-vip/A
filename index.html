        /* နောက်ခံ အနီရင့်ရောင် Gradient လှုပ်ရှားမှု */
        body {
            margin: 0;
            padding: 20px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #1a0101, #450404, #910909, #000000);
            background-size: 400% 400%;
            animation: gradientBG 8s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* နှင်းကျနေသည့် ပုံစံ (အနီရောင်နှင့် လိုက်ဖက်အောင် opacity လျှော့ထားသည်) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('https://www.transparenttextures.com/patterns/snow.png');
            animation: snow 15s linear infinite;
            pointer-events: none;
            z-index: 1;
            opacity: 0.2;
        }

        @keyframes snow {
            0% { background-position: 0px 0px; }
            100% { background-position: 500px 1000px; }
        }

        /* Glassmorphism Card Style */
        .card {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 25px;
            border-radius: 35px;
            text-align: center;
            width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 15px rgba(237, 28, 36, 0.2);
            position: relative;
            z-index: 2;
        }

        .main-logo {

            margin-bottom: 12px;

        }

        .logo-name-text {

            font-weight: 900;
            margin-bottom: 25px;
            letter-spacing: 2px;
            background: linear-gradient(to right, #ff5f6d, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .package-title {

            border-radius: 12px;
            font-weight: bold;
            margin: 18px 0 10px 0;
            display: flex;
            align-items: center;

        .bg-true { background: linear-gradient(90deg, #ed1c24, #ff5f6d); }
        .bg-dtac { background: linear-gradient(90deg, #00aaff, #00d2ff); }
        .bg-ais { background: linear-gradient(90deg, #94c11f, #b4ec51); }

        .package-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .package-item {
            background: rgba(255, 255, 255, 0.95);
            color: #1a1a1a;
            padding: 12px 18px;
            border-radius: 15px;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Mouse တင်လျှင် ညာဘက်သို့ တိုးသွားသည့် Effect */
        .package-item:hover {
            transform: translateX(10px);
            background: #ffffff;
            box-shadow: -5px 0 15px rgba(237, 28, 36, 0.4);
        }

        .package-item:active { transform: scale(0.95); }
        .code { font-weight: bold; }
        .price { color: #d32f2f; font-weight: bold; }

        /* Download Button Glow Effect */
        .download-btn {

            padding: 16px;
            border-radius: 50px;
            text-decoration: none;

            display: block;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .download-btn:hover {

            z-index: 1000;

        }
