<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSO VIP - VPN Download</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #3a7bd5, #00d2ff); /* အပြာရောင် Gradient */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* (၁) လိုဂိုပုံ */
        .main-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ff416c; /* လိုဂိုအရောင်နဲ့ လိုက်ဖက်အောင် အနီလိုင်းထည့်ထားသည် */
            margin-bottom: 15px;
            object-fit: cover;
        }

        .logo-name {
            font-size: 2.2em;
            font-weight: bold;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .description {
            font-size: 0.9em;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        /* (၂၊ ၃၊ ၄) TRUE, AIS, DTAC ခလုတ်များ */
        .operator-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .op-box {
            background: white;
            color: #333;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.8em;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
        }

        .op-box.true { color: #ff0000; }
        .op-box.ais { color: #00b300; }
        .op-box.dtac { color: #00aaff; }

        /* (၅) Download ခလုတ် */
        .download-btn {
            background: #0052D4;
            background: linear-gradient(to right, #6fb1fc, #4364f7, #0052D4);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .download-btn:hover {
            transform: scale(1.05);
        }

        /* (၆) Message လိုဂို */
        .msg-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0084FF; /* Messenger Blue */
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://r2.erweima.ai/i/0_4228965902172772714.png" class="main-logo" alt="KSO Logo">
        
        <div class="logo-name">KSO</div>
        <p class="description">VPN ဝန်ဆောင်မှုကို အမြန်နှုန်းအမြင့်ဆုံးဖြင့် <br> အသုံးပြုနိုင်ပါသည်။</p>

        <div class="operator-group">
            <div class="op-box true">TRUE</div>
            <div class="op-box ais">AIS</div>
            <div class="op-box dtac">DTAC</div>
        </div>

        <a href="သင့်ရဲ့_APK_Link_ဒီမှာထည့်ပါ" class="download-btn">
            <i class="fas fa-download"></i> Download App
        </a>
    </div>

    <a href="https://m.me/ကိုယ့်Pageနာမည်" class="msg-btn">
        <i class="fab fa-facebook-messenger"></i>
    </a>

</body>
</html>
