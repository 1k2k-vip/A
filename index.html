<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSO VIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 20px;
            border-radius: 25px;
            text-align: center;
            width: 350px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* လိုဂိုဆိုဒ် 60 ပြင်ဆင်ထားသည် */
        .main-logo {
            width: 60px;
            height: 60px;
        
        }

        .logo-name {
            font-size: 1.6em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #00d2ff;
        }

        .package-title {
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            margin: 12px 0 6px 0;
            display: flex;
            align-items: center;
            font-size: 0.85em;
        }

        .bg-true { background: #ed1c24; }
        .bg-dtac { background: #00aaff; }
        .bg-ais { background: #94c11f; }

        .package-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .package-item {
            background: white;
            color: #333;
            padding: 8px 12px;
            border-radius: 10px;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        .code { font-weight: bold; }

        .download-btn {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            color: white;
            padding: 12px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 20px;
        }

        .msg-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0084FF;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://github.com/1k2k-vip/kso-udp/blob/main/icon.png" class="main-logo" alt="KSO Logo">
        
        <div class="logo-name">KSO VIP</div>

        <div class="package-title bg-true">TRUE PACKAGES</div>
        <div class="package-list">
            <a href="tel:*900*3507#" class="package-item"><span class="code">*900*3507#</span> <span>1ရက် 6ဘတ်</span></a>
            <a href="tel:*900*3508#" class="package-item"><span class="code">*900*3508#</span> <span>7ရက် 21ဘတ်</span></a>
            <a href="tel:*900*3509#" class="package-item"><span class="code">*900*3509#</span> <span>30ရက် 53ဘတ်</span></a>
        </div>

        <div class="package-title bg-dtac">DTAC PACKAGES</div>
        <div class="package-list">
            <a href="tel:*177*15#" class="package-item"><span class="code">*177*15#</span> <span>15ရက် 15ဘတ်</span></a>
            <a href="tel:*177*30#" class="package-item"><span class="code">*177*30#</span> <span>30ရက် 30ဘတ်</span></a>
        </div>

        <div class="package-title bg-ais">AIS PACKAGES</div>
        <div class="package-list">
            <a href="tel:*777*7067#" class="package-item"><span class="code">*777*7067#</span> <span>30ရက် 30ဘတ်</span></a>
            <a href="tel:*777*7068#" class="package-item"><span class="code">*777*7068#</span> <span>30ရက် 33ဘတ်</span></a>
        </div>

        <a href="YOUR_APK_LINK" class="download-btn">Download APK</a>
    </div>

    <a href="https://m.me/YOUR_PAGE" class="msg-btn">
        <i class="fab fa-facebook-messenger"></i>
    </a>

</body>
</html>
