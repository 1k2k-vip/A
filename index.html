    <style>
        :root {
            /* Light Mode Colors (Default) */
            --bg-color: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1a1a1a;
            --text-sub: #65676b;
            --snow-color: #ffffff;
            --snow-glow: rgba(0, 0, 0, 0.1);
            --border-color: rgba(0, 0, 0, 0.05);
            
            --true-color: linear-gradient(135deg, #ff416c, #ff4b2b);
            --dtac-color: linear-gradient(135deg, #00c6ff, #0072ff);
            --ais-color: linear-gradient(135deg, #a8ff78, #78ffd6);
        }

        /* Dark Mode Colors (Auto Switch) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0d0d11;
                --card-bg: rgba(24, 24, 28, 0.9);
                --text-main: #ffffff;
                --text-sub: rgba(255, 255, 255, 0.6);
                --snow-color: #ffffff;
                --snow-glow: rgba(255, 255, 255, 0.8);
                --border-color: rgba(255, 255, 255, 0.1);
            }
        }

        body {
            margin: 0; padding: 20px 10px;
            font-family: 'Zeyar', sans-serif;
            background-color: var(--bg-color);
            transition: background-color 0.5s ease;
            min-height: 100vh; display: flex; justify-content: center; align-items: center; color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- Snow Styling (Big & Clear) --- */
        .snow-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }

        .snowflake {
            position: absolute; top: -20px;
            background: var(--snow-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--snow-glow);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0vh) translateX(0); }
            100% { transform: translateY(110vh) translateX(80px); }
        }

        /* --- Card Design --- */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 35px 22px; border-radius: 40px; text-align: center;
            width: 100%; max-width: 380px; 
            border: 1px solid var(--border-color);
            position: relative; z-index: 10;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        .main-logo { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #ff416c; background: #fff; padding: 4px; margin-bottom: 15px; }
        
        .logo-name-text { 
            font-family: 'Montserrat', sans-serif; font-size: 2.5em; font-weight: 800; 
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .sub-text { color: var(--text-sub); margin-bottom: 25px; font-size: 1.1em; }

        .mini-logos { display: flex; justify-content: center; gap: 30px; margin-bottom: 25px; }
        .mini-logos a { font-size: 30px; text-decoration: none; color: var(--text-main); transition: 0.3s; }
        .mini-logos a:hover { transform: scale(1.2); color: #ff416c; }

        .package-title { 
            padding: 12px 18px; border-radius: 15px; font-weight: 800; margin: 25px 0 10px 0; 
            font-family: 'Montserrat', sans-serif; font-size: 0.85em; text-align: left; color: #fff;
        }
        .bg-true { background: var(--true-color); }
        .bg-dtac { background: var(--dtac-color); }
        .bg-ais { background: var(--ais-color); color: #000; }

        .package-item { 
            background: rgba(128, 128, 128, 0.1); padding: 15px; border-radius: 22px; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 10px; border: 1px solid var(--border-color);
        }

        .code { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.3em; color: var(--text-main); }
        .price { display: block; font-size: 1em; color: var(--text-sub); text-align: left; }
        
        .call-btn { 
            background: #2ecc71; color: white; width: 48px; height: 48px; 
            border-radius: 16px; display: flex; justify-content: center; align-items: center; 
            text-decoration: none; font-size: 1.3em;
        }

        .download-btn { 
            background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; padding: 20px; 
            border-radius: 25px; text-decoration: none; font-weight: 800; display: block; 
            margin-top: 30px; font-family: 'Montserrat', sans-serif;
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.3);
        }
        
        .msg-btn { 
            position: fixed; bottom: 25px; right: 25px; background: #0084FF; 
            width: 65px; height: 65px; border-radius: 20px; display: flex; 
            justify-content: center; align-items: center; color: white; font-size: 30px; 
            text-decoration: none; z-index: 100; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>

<script>
    const snowContainer = document.getElementById('snow-container');
    const snowCount = 40; 

    for (let i = 0; i < snowCount; i++) {
