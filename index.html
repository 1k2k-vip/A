    <style>
        :root {
            --true-color: linear-gradient(135deg, #ff416c, #ff4b2b);
            --dtac-color: linear-gradient(135deg, #4facfe, #00f2fe);
            --ais-color: linear-gradient(135deg, #667eea, #764ba2);

        body {
            margin: 0; padding: 20px 10px;
            font-family: 'Zeyar', 'Noto Sans Myanmar', sans-serif;
            background-color: #0d0d11;
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0d0d11 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; color: white;
            background-attachment: fixed;
            overflow-x: hidden; /* နှင်းတွေကြောင့် ဘေးတိုက်မရွေ့အောင် */
        }

        /* နှင်းကျသည့် စနစ် (Snow Effect) */
        .snow-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1000;
        }
        .snowflake {
            position: absolute; top: -10px; color: white; font-size: 1em;
            opacity: 0.8; user-select: none; pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .card {
            position: relative; z-index: 100;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 30px 20px; border-radius: 40px; text-align: center;
            width: 100%; max-width: 380px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        }

        .main-logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #ff416c; margin-bottom: 12px; background: white; padding: 3px; }
        .logo-name-text { font-family: 'Montserrat', sans-serif; font-size: 2.4em; font-weight: 800; background: linear-gradient(to right, #fff, #ff416c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sub-text { font-family: 'Zeyar', cursive; font-size: 1.1em; color: rgba(255, 255, 255, 0.7); margin-bottom: 20px; }

        .online-box { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 25px; }
        .status-header { display: flex; align-items: center; gap: 10px; background: rgba(46, 204, 113, 0.1); padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(46, 204, 113, 0.3); color: #2ecc71; }
        .online-label { font-family: 'Zeyar', cursive; font-size: 0.9em; color: #2ecc71; }
        .dot { width: 8px; height: 8px; background-color: #2ecc71; border-radius: 50%; position: relative; }
        .dot::after { content: ''; position: absolute; width: 100%; height: 100%; background-color: #2ecc71; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(3); opacity: 0; } }

        .package-title { padding: 12px 18px; border-radius: 15px; font-weight: 700; margin: 25px 0 12px 0; display: flex; align-items: center; font-size: 0.85em; font-family: 'Montserrat', sans-serif; }
        .bg-true { background: var(--true-color); }
        .bg-dtac { background: var(--dtac-color); }
        .bg-ais { background: var(--ais-color); }
        
        .package-item { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 22px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .code { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.2em; }
        .price { font-family: 'Zeyar', cursive; font-size: 1em; color: rgba(255, 255, 255, 0.85); }
        
        .call-btn { background: #2ecc71; color: white; width: 44px; height: 44px; border-radius: 15px; display: flex; justify-content: center; align-items: center; text-decoration: none; }
        .download-btn { background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; padding: 18px; border-radius: 22px; text-decoration: none; font-weight: 700; display: block; margin-top: 35px; font-family: 'Montserrat', sans-serif; }
    </style>
</head>

<script>
    // နှင်းပွင့်များ ဖန်တီးသည့် Script
    function createSnowflake() {
        const snow = document.getElementById('snow');
        const flake = document.createElement('div');
        flake.classList.add('snowflake');
        flake.innerHTML = '❄';
        flake.style.left = Math.random() * 100 + 'vw';
        flake.style.animationDuration = Math.random() * 3 + 2 + 's'; // 2s to 5s
        flake.style.opacity = Math.random();
        flake.style.fontSize = Math.random() * 10 + 10 + 'px';
        
        snow.appendChild(flake);
        
        setTimeout(() => {
            flake.remove();
        }, 5000);
    }
    setInterval(createSnowflake, 150);
</script>
