<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အချက်အလက် ထည့်သွင်းခြင်း</title>
    <link rel="stylesheet" href="style.css"> </head>
<body>

    <div class="container">
        <h1>အချက်အလက် ထည့်သွင်းပါ</h1>
        <form id="dataForm">
            <div class="form-group">
                <label for="fullName">အမည် အပြည့်အစုံ:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="bankAccountNumber">ဘဏ် အကောင့်နံပါတ်:</label>
                <input type="text" id="bankAccountNumber" name="bankAccountNumber" pattern="\d{10,16}" title="ဘဏ်နံပါတ်သည် ဂဏန်း ၁၀ လုံးမှ ၁၆ လုံးအထိသာ ဖြစ်ရပါမည်။" required>
            </div>

            <button type="submit">အချက်အလက်များ လွှဲပြောင်းပါ</button>
        </form>

        <div id="output" class="output-box">
            <p>ထည့်သွင်းထားသော အချက်အလက်များ ဒီနေရာတွင် ပေါ်လာပါမည်။</p>
        </div>
    </div>

    <script src="script.js"></script> </body>
</html>
