<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSO VIP - Handwriting Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Zeyar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            margin: 0;
            padding: 20px 0;
            /* ဖောင့်အမည်ကို Zeyar ဟု ပြောင်းလဲထားသည် */
            font-family: 'Zeyar', cursive, sans-serif;

                        url('https://raw.githubusercontent.com/1k2k-vip/A/main/ba.png');

            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(77, 0, 0, 0.9); /* Card အရောင်ကို အနည်းငယ် ပိုကြည်လင်စေသည် */
            padding: 25px 15px;
            border-radius: 40px;
            text-align: center;
            width: 350px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .main-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #ed1c24;
            background: #ed1c24;
            display: block;
            margin: 0 auto 10px;
            box-shadow: 0 0 20px rgba(237, 28, 36, 0.5);
        }

        .logo-text {
            font-size: 2.5em; /* လက်ရေးဆိုတော့ အနည်းငယ် ပိုကြီးထားမှ လှသည် */
            font-weight: normal;
            color: #fff;
            margin-bottom: 20px;
        }

        .category-title {
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            margin: 15px 0 8px 0;
            display: flex;
            align-items: center;
            font-size: 1em;
        }

        .bg-true { background: #ed1c24; }
        .bg-dtac { background: #00aaff; }
        .bg-ais { background: #76ba1b; }

        .package-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .package-item {
            background: #ffffff;
            color: #222;
            padding: 10px 18px;
            border-radius: 30px;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1em; /* လက်ရေးဖောင့်များအတွက် font size ကို မြှင့်ထားသည် */
            transition: 0.3s;
        }

        .price-text {
            color: #d32f2f;
            font-weight: bold;
        }

        .download-btn {
            background: linear-gradient(to right, #ed1c24, #ff5e62);
            color: white;
            padding: 15px;
            border-radius: 50px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 25px;
            font-size: 1.1em;
        }

        .msg-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0084FF;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 28px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://raw.githubusercontent.com/1k2k-vip/kso-udp/main/icon.png" class="main-logo">

            <a href="tel:*900*3508%23" class="package-item"><span>*900*3508#</span> <span class="price-text">21 ဘတ်</span></a>
        </div>

        <div class="category-title bg-dtac"><i class="fas fa-sim-card"></i>&nbsp; Dtac ဖုန်းများအတွက်</div>
        <div class="package-list">
            <a href="tel:*177*15%23" class="package-item"><span>*177*15#</span> <span class="price-text">15 ဘတ်</span></a>
        </div>

        <div class="category-title bg-ais"><i class="fas fa-sim-card"></i>&nbsp; Ais ဖုန်းများအတွက်</div>
        <div class="package-list">
            <a href="tel:*777*7067%23" class="package-item"><span>*777*7067#</span> <span class="price-text">30 ဘတ်</span></a>
        </div>

        <a href="https://github.com/1k2k-vip/Apk/releases/download/v1.07/KSO.VPN.apk" class="download-btn">
            <i class="fas fa-download"></i> အက်ပ်ဒေါင်းလုဒ်ဆွဲရန်
        </a>
    </div>
