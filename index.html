<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivo Y72 5G Wallpaper Mockup Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <h2 class="app-header">📱 Vivo Y72 5G Mockup</h2>

        <div class="upload-area">
            နောက်ခံပုံ (Wallpaper) ကို ဤနေရာသို့ ဆွဲထည့်ပါ သို့မဟုတ် <input type="file" id="imageUpload" accept="image/png, image/jpeg"> ရွေးချယ်ပါ
            <p>(PNG သို့မဟုတ် JPG)</p>
        </div>
        
        <div class="mockup-section">
            <h3 class="mockup-title">ထုတ်လုပ်ထားသော Mockup</h3>
            
            <div id="phoneFrame" class="phone-frame-image" 
                 style="background-image: url('https://github.com/1k2k-vip/A/blob/main/1765583434579.png');">
                
                <div id="wallpaperLayer" class="wallpaper-layer">
                    </div>
            </div>
            
            <button id="generateMockupBtn" class="save-button">
                 ⬇️ Mockup ပုံကို သိမ်းဆည်းရန်
            </button>
            
            <a href="#" id="downloadLink" download="vivo-y72-mockup.png" class="download-link" style="display:none;">
                <button class="download-button">
                    ...ဒေါင်းလုဒ် လုပ်ဆောင်နေပါသည်...
                </button>
            </a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
